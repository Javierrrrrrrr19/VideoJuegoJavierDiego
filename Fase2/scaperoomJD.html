<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scape Room Javier y Diego</title>
   <!-- Recursos externos propios -->
   <link rel="stylesheet" href="style/scaperoomJD.css" />
   <script src="./js/scaperoomJD.js" defer></script>
</head>
<body>
  <main class="escena" id="principal">
    <div class="puerta" id="puerta" onclick="entrada()"></div>
    <div class="acertijos" id="acertijos">
      <p><label for="respuesta" id="pregunta">Este banco está ocupado por un padre y su hijo, el padre se llama Juan y el hijo ya te lo he dicho</label><br>
      <input type="text" id="respuesta"></p>
      <p><input type="button" value="Respuesta" onclick="respuesta()"></p>
      <div id="divincorrecto"></div>
    </div>
    <div class="izquierda" id="izquierda" onclick="entradaIzq()"></div>
    <div class="derechaBlock" id="derechaBlock" onclick="derechaBlok()"></div>
    <div class="derecha" id="derecha" onclick="entradaDer()"></div>
    <div class="izquierdaBlock" id="izquierdaBlock" onclick="izquierdaBlock()"></div>
    <div class="cajamusica" id="cajamusica" onclick="codigo()"></div>
    <div class="codigo" id="codigo" onclick="volver()"></div>
    <div class="codigoP" id="codigoP">
      <input type="number" id="codigoAceptado" min="1000" max="9999"></p>
      <p><input type="button" value="Probar" onclick="probar()"></p>
      <div id="divincorrecto2"></div>
    </div>
    <div class="llave" id="llave" onclick="llaveCandado()"></div>
    <div class="candado" id="candado" onclick="sotano()"></div>
    <img src="img/interruptorA.png" class="interruptorA" id="interruptorA" onclick="enciende()">
    <img src="img/interruptorB.png" class="interruptorB" id="interruptorB">
    <div class="cajaFuerteA" id="cajaFuerteA"></div>
    <div class="cajaFuerteB" id="cajaFuerteB" onclick="acertijoCajaFuerte()"></div>
    <div class="matematico" id="matematico">
      <img src="img/frutas.png" class="frutas">
      <input type="number" id="numeroAceptado"></p>
      <p><input type="button" value="Respuesta" onclick="resultado()"></p>
      <div id="divincorrecto3"></div>
    </div>
    <div class="final" id="final">
      <img src="img/fresquito.png" class="fresquitos"><br>
      <p><input type="button" value="Te los tomas" id="botonGanar" onclick="ganas()">
      <input type="button" value="No te los tomas" id="botonPerder" onclick="pierdes()"></p>
    </div>
  </main>
  <footer class="mensaje" id="bocadillo">
     <p id="parrafo1">Jugador - Me han dicho unos amigos que en esa casa hay polvos mágicos.</p>
     <p id="parrafo2">Entra a la casa</p>
     <p id="parrafo3"></p>
  </footer>

</body>
</html>
